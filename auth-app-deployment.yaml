apiVersion: apps/v1
kind: Deployment
metadata:
  annotations:
    kompose.cmd: kompose convert -f docker-compose.yml
    kompose.version: 1.33.0 (3ce457399)
  labels:
    io.kompose.service: auth-app
  name: auth-app
spec:
  replicas: 1
  selector:
    matchLabels:
      io.kompose.service: auth-app
  strategy:
    type: Recreate
  template:
    metadata:
      annotations:
        kompose.cmd: kompose convert -f docker-compose.yml
        kompose.version: 1.33.0 (3ce457399)
      labels:
        io.kompose.network/micro-default: "true"
        io.kompose.service: auth-app
    spec:
      containers:
        - args:
            - bash
            - -c
            - python ./manage.py makemigrations && python ./manage.py migrate && python ./manage.py runserver 0.0.0.0:8001
          image: auth-app
          name: auth-app
          ports:
            - containerPort: 8001
              hostPort: 8001
              protocol: TCP
          volumeMounts:
            - mountPath: /app
              name: auth-app-cm0
      restartPolicy: Always
      volumes:
        - configMap:
            name: auth-app-cm0
          name: auth-app-cm0
